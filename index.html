
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See Your Pictures Here</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#10131c;color:white}
header{text-align:center;padding:45px 15px;background:linear-gradient(135deg,#172b4d,#6537a5)}
h1{font-size:30px;margin:0 0 12px}
header p{color:#ddd}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;padding:18px}
.gallery img{width:100%;height:190px;object-fit:cover;border-radius:14px;background:#292d3b}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>See Your Pictures Here</h1>
<p>A beautiful collection of pictures</p>
</header>
<main class="gallery">
</main>
<footer>Welcome to our picture gallery</footer>
</body>
</html>
